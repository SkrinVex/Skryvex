name: skryvex
description: "Skryvex messenger"
publish_to: "none"
version: 1.2.0+12

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  shared_preferences: ^2.3.3
  web_socket_channel: ^3.0.1
  intl: ^0.19.0
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  photo_view: ^0.15.0
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
